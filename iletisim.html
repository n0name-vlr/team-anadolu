    <!-- Kalıcı Tema ve Dil Scripti -->
    <script>
        const htmlElement = document.documentElement;
        const themeToggle = document.getElementById('theme-toggle');
        const langBtn = document.getElementById('lang-btn');
        const langMenu = document.getElementById('lang-menu');

        const currentTheme = localStorage.getItem('tanu_theme') || 'light';
        const currentLang = localStorage.getItem('tanu_lang') || 'tr';

        htmlElement.setAttribute('data-theme', currentTheme);
        if (themeToggle) {
            themeToggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
        }
        if (currentLang === 'en') {
            setLanguage('en');
        }

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const activeTheme = htmlElement.getAttribute('data-theme');
                const newTheme = activeTheme === 'light' ? 'dark' : 'light';
                
                htmlElement.setAttribute('data-theme', newTheme);
                themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
                localStorage.setItem('tanu_theme', newTheme);
            });
        }

        if (langBtn && langMenu) {
            langBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                langMenu.style.display = langMenu.style.display === 'block' ? 'none' : 'block';
            });

            window.addEventListener('click', () => {
                langMenu.style.display = 'none';
            });

            document.querySelectorAll('.lang-menu a').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const selectedLang = e.target.getAttribute('data-lang');
                    setLanguage(selectedLang);
                    localStorage.setItem('tanu_lang', selectedLang);
                });
            });
        }

        function setLanguage(lang) {
            if (langBtn) {
                langBtn.textContent = lang.toUpperCase() + ' ▾';
            }
            document.querySelectorAll('[data-tr]').forEach(el => {
                const text = el.getAttribute(`data-${lang}`);
                if (text) el.textContent = text;
            });
        }
    </script>
